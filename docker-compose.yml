version: '3.8'

services:
  api:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env

  web:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    env_file:
      - .env

  worker:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.worker
    env_file:
      - .env

  redis:
    image: redis:6
    ports:
      - "6379:6379"

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"